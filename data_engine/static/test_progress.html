<!DOCTYPE html>
<html>
<head>
    <title>Progress Test</title>
</head>
<body>
    <h1>Progress Test</h1>
    <div id="progress-batch0001">Loading...</div>
    <div id="progress-batch0002">Loading...</div>
    
    <script>
        async function testProgress() {
            console.log('Testing progress...');
            try {
                const response = await fetch('/api/progress');
                const data = await response.json();
                const allTasks = Object.values(data.tasks);
                console.log('All tasks:', allTasks.length);
                
                const sources = ['batch0001', 'batch0002'];
                sources.forEach(sourceId => {
                    const progressCell = document.getElementById(`progress-${sourceId}`);
                    console.log(`Processing source: ${sourceId}, cell found: ${!!progressCell}`);
                    
                    if (progressCell) {
                        const sourceTasks = allTasks
                            .filter(task => task.source_id === sourceId)
                            .sort((a, b) => (b.start_time || 0) - (a.start_time || 0));
                        
                        console.log(`Source ${sourceId} tasks: ${sourceTasks.length}`);
                        
                        if (sourceTasks.length === 0) {
                            progressCell.innerHTML = 'No tasks';
                        } else {
                            const latestTask = sourceTasks[0];
                            console.log(`Latest task for ${sourceId}:`, latestTask.task_id, latestTask.status, latestTask.progress_percentage);
                            progressCell.innerHTML = `
                                ${latestTask.task_type.toUpperCase()} - ${latestTask.status}<br>
                                ${latestTask.current}/${latestTask.total} (${latestTask.progress_percentage.toFixed(1)}%)<br>
                                ${latestTask.message}
                            `;
                        }
                    }
                });
            } catch (error) {
                console.error('Error:', error);
            }
        }
        
        // 立即执行
        testProgress();
        
        // 每10秒执行一次
        setInterval(testProgress, 10000);
    </script>
</body>
</html>
