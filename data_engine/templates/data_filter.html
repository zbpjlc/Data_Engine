<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Engine - 数据筛选</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-50">
    <div class="min-h-screen">
        <!-- Header -->
        <header class="bg-white shadow-sm border-b">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between items-center py-4">
                    <h1 class="text-2xl font-bold text-gray-900">Data Engine Console</h1>
                    <nav class="flex space-x-4">
                        <a href="/" class="text-gray-600 hover:text-blue-600">数据地图</a>
                        <a href="/data-filter" class="text-blue-600 font-medium">数据筛选</a>
                        <a href="/hard-case-review" class="text-gray-600 hover:text-blue-600">Hard Case复核</a>
                        <a href="/qa-sampling" class="text-gray-600 hover:text-blue-600">QA抽检</a>
                        <a href="/lancedb" class="text-gray-600 hover:text-blue-600">LanceData</a>
                    </nav>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <!-- 数据聚类卡片 -->
            <div class="bg-white rounded-lg shadow p-6 mb-8">
                <h2 class="text-lg font-semibold text-gray-900 mb-6">数据聚类</h2>
                
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <!-- 左侧：聚类配置 -->
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">数据源</label>
                            <select id="cluster-source" class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm">
                                <option value="">选择数据源...</option>
                                <option value="__all__">全部数据源</option>
                                {% for source in sources %}
                                <option value="{{ source.source_id }}">{{ source.source_id }} ({{ source.batch_count }} 批次)</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">批次</label>
                            <select id="cluster-batch" class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm">
                                <option value="">全部批次</option>
                            </select>
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">聚类数 (K)</label>
                                <input id="cluster-k" type="number" value="5" min="2" max="100" class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm">
                            </div>
                            <div class="flex items-end">
                                <label class="flex items-center text-sm text-gray-700">
                                    <input id="cluster-auto" type="checkbox" checked class="mr-2 rounded"> 自动优化K值
                                </label>
                            </div>
                        </div>
                        <button id="btn-cluster" class="w-full px-4 py-2 bg-purple-600 text-white rounded-md hover:bg-purple-700 font-medium">
                            开始聚类
                        </button>
                        <div id="cluster-progress" class="hidden">
                            <div class="flex items-center justify-between text-sm mb-1">
                                <span id="cluster-progress-msg" class="text-gray-600">准备中...</span>
                                <span id="cluster-progress-pct" class="text-purple-600 font-medium">0%</span>
                            </div>
                            <div class="w-full bg-gray-200 rounded-full h-2">
                                <div id="cluster-progress-bar" class="bg-purple-600 h-2 rounded-full transition-all" style="width:0%"></div>
                            </div>
                        </div>
                    </div>

                    <!-- 右侧：聚类结果 -->
                    <div>
                        <div id="cluster-result-empty" class="flex items-center justify-center h-full text-gray-400 text-sm">
                            执行聚类后将在此显示结果
                        </div>
                        <div id="cluster-result" class="hidden space-y-4">
                            <div class="grid grid-cols-3 gap-3">
                                <div class="bg-purple-50 rounded-lg p-3 text-center">
                                    <div class="text-xs text-purple-600 mb-1">聚类数</div>
                                    <div id="stat-k" class="text-xl font-bold text-purple-800">-</div>
                                </div>
                                <div class="bg-blue-50 rounded-lg p-3 text-center">
                                    <div class="text-xs text-blue-600 mb-1">轮廓系数</div>
                                    <div id="stat-silhouette" class="text-xl font-bold text-blue-800">-</div>
                                </div>
                                <div class="bg-green-50 rounded-lg p-3 text-center">
                                    <div class="text-xs text-green-600 mb-1">有效样本</div>
                                    <div id="stat-valid" class="text-xl font-bold text-green-800">-</div>
                                </div>
                            </div>
                            <div class="bg-gray-50 rounded-lg p-4">
                                <canvas id="cluster-chart" height="180"></canvas>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 高级筛选器 -->
            <div class="bg-white rounded-lg shadow p-6 mb-8">
                <h2 class="text-lg font-semibold text-gray-900 mb-6">数据筛选</h2>
                
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <!-- 数据源筛选 -->
                    <div class="space-y-4">
                        <h3 class="text-md font-medium text-gray-700">数据源</h3>
                        <div class="space-y-2">
                            {% for source in sources %}
                            <label class="flex items-center">
                                <input type="checkbox" value="{{ source.source_id }}" class="source-checkbox mr-2">
                                <span class="text-sm text-gray-700">{{ source.source_id }}</span>
                                <span class="text-xs text-gray-500 ml-2">({{ source.batch_count }} 批次)</span>
                            </label>
                            {% endfor %}
                        </div>
                    </div>

                    <!-- 批次筛选 -->
                    <div class="space-y-4">
                        <h3 class="text-md font-medium text-gray-700">批次</h3>
                        <div class="space-y-2 max-h-48 overflow-y-auto">
                            {% for batch in batches %}
                            <label class="flex items-center">
                                <input type="checkbox" value="{{ batch.batch_id }}" class="batch-checkbox mr-2">
                                <span class="text-sm text-gray-700">{{ batch.batch_id }}</span>
                                <span class="text-xs text-gray-500 ml-2">({{ batch.sample_count }} 样本)</span>
                            </label>
                            {% endfor %}
                        </div>
                    </div>

                    <!-- 处理状态筛选 -->
                    <div class="space-y-4">
                        <h3 class="text-md font-medium text-gray-700">数据状态</h3>
                        <div class="space-y-2">
                            <label class="flex items-center">
                                <input type="checkbox" value="has_embedding" class="status-checkbox mr-2">
                                <span class="text-sm text-gray-700">已有向量</span>
                            </label>
                            <label class="flex items-center">
                                <input type="checkbox" value="has_cluster" class="status-checkbox mr-2">
                                <span class="text-sm text-gray-700">已聚类</span>
                            </label>
                            <label class="flex items-center">
                                <input type="checkbox" value="no_cluster" class="status-checkbox mr-2">
                                <span class="text-sm text-gray-700">未聚类</span>
                            </label>
                        </div>
                    </div>
                </div>

                <!-- 操作按钮 -->
                <div class="flex justify-between items-center mt-6 pt-6 border-t border-gray-200">
                    <div class="space-x-4">
                        <button id="select-all" class="px-4 py-2 bg-gray-600 text-white rounded-md hover:bg-gray-700">全选</button>
                        <button id="clear-all" class="px-4 py-2 bg-gray-400 text-white rounded-md hover:bg-gray-500">清空</button>
                    </div>
                    <div class="space-x-4">
                        <button id="apply-filter" class="px-6 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700">应用筛选</button>
                        <button id="export-data" class="px-4 py-2 bg-green-600 text-white rounded-md hover:bg-green-700">导出数据</button>
                    </div>
                </div>
            </div>

            <!-- 筛选结果 -->
            <div class="bg-white rounded-lg shadow">
                <div class="px-6 py-4 border-b border-gray-200">
                    <h2 class="text-lg font-semibold text-gray-900">筛选结果</h2>
                </div>
                <div class="p-6">
                    <div id="filter-summary" class="mb-4 text-sm text-gray-600">
                        请选择筛选条件后点击"应用筛选"
                    </div>
                    <div id="results-table" class="overflow-x-auto">
                        <table class="min-w-full divide-y divide-gray-200">
                            <thead class="bg-gray-50">
                                <tr>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">样本ID</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">数据源</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">批次</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">类型</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">聚类ID</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">难度</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">操作</th>
                                </tr>
                            </thead>
                            <tbody id="results-body" class="bg-white divide-y divide-gray-200">
                                <tr>
                                    <td colspan="7" class="px-6 py-12 text-center text-gray-500">暂无数据</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const batchData = {{ batches_json | tojson }};
        let clusterChart = null;

        // 聚类数据源联动批次
        document.getElementById('cluster-source').addEventListener('change', function() {
            const sourceId = this.value;
            const batchSelect = document.getElementById('cluster-batch');
            batchSelect.innerHTML = '<option value="">全部批次</option>';
            const filtered = sourceId === '__all__' ? batchData : batchData.filter(b => b.source_id === sourceId);
            filtered.forEach(b => {
                batchSelect.innerHTML += `<option value="${b.batch_id}">${b.source_id}/${b.batch_id} (${b.sample_count} 样本)</option>`;
            });
        });

        // 开始聚类
        document.getElementById('btn-cluster').addEventListener('click', function() {
            const sourceId = document.getElementById('cluster-source').value;
            if (!sourceId) { alert('请选择数据源'); return; }

            const k = document.getElementById('cluster-k').value;
            const auto = document.getElementById('cluster-auto').checked;
            const progressDiv = document.getElementById('cluster-progress');
            const resultEmpty = document.getElementById('cluster-result-empty');
            const resultDiv = document.getElementById('cluster-result');

            progressDiv.classList.remove('hidden');
            resultEmpty.classList.add('hidden');
            resultDiv.classList.add('hidden');
            this.disabled = true;
            this.textContent = '聚类中...';

            fetch(`/api/cluster/${sourceId}?n_clusters=${k}&auto_optimize=${auto}`, { method: 'POST' })
                .then(r => r.json())
                .then(() => pollCluster(sourceId))
                .catch(err => {
                    alert('聚类启动失败: ' + err.message);
                    resetClusterBtn();
                });
        });

        function pollCluster(sourceId) {
            const interval = setInterval(() => {
                fetch('/api/progress').then(r => r.json()).then(data => {
                    let tasks = Object.values(data.tasks || {}).filter(t => t.task_type === 'cluster');
                    if (sourceId !== '__all__') {
                        tasks = tasks.filter(t => t.source_id === sourceId);
                    }
                    if (tasks.length === 0) return;

                    const totalAll = tasks.reduce((s, t) => s + (t.total || 0), 0);
                    const currentAll = tasks.reduce((s, t) => s + (t.current || 0), 0);
                    const pct = totalAll > 0 ? Math.round(currentAll / totalAll * 100) : 0;
                    const running = tasks.filter(t => t.status === 'running');
                    const failed = tasks.filter(t => t.status === 'failed');
                    const lastMsg = tasks[tasks.length - 1].message;
                    document.getElementById('cluster-progress-msg').textContent = `${lastMsg} (${tasks.length} 批次)`;
                    document.getElementById('cluster-progress-pct').textContent = pct + '%';
                    document.getElementById('cluster-progress-bar').style.width = pct + '%';

                    if (running.length === 0 && failed.length === 0) {
                        clearInterval(interval);
                        document.getElementById('cluster-progress-bar').classList.remove('bg-purple-600');
                        document.getElementById('cluster-progress-bar').classList.add('bg-green-500');
                        loadClusterStats(sourceId);
                        resetClusterBtn();
                    } else if (running.length === 0 && failed.length > 0) {
                        clearInterval(interval);
                        document.getElementById('cluster-progress-bar').classList.remove('bg-purple-600');
                        document.getElementById('cluster-progress-bar').classList.add('bg-red-500');
                        document.getElementById('cluster-progress-msg').textContent = '失败: ' + failed[0].error_message;
                        resetClusterBtn();
                    }
                }).catch(() => {});
            }, 1000);
        }

        function resetClusterBtn() {
            const btn = document.getElementById('btn-cluster');
            btn.disabled = false;
            btn.textContent = '开始聚类';
        }

        function loadClusterStats(sourceId) {
            const resultDiv = document.getElementById('cluster-result');
            const resultEmpty = document.getElementById('cluster-result-empty');
            resultEmpty.classList.add('hidden');
            resultDiv.classList.remove('hidden');

            let url = sourceId === '__all__' ? '/api/filter-data?page_size=10000' : `/api/filter-data?sources=${sourceId}&page_size=10000`;
            fetch(url)
                .then(r => r.json())
                .then(data => {
                    const clusterCounts = {};
                    let valid = 0;
                    data.samples.forEach(s => {
                        const cid = s.cluster_id || 'N/A';
                        clusterCounts[cid] = (clusterCounts[cid] || 0) + 1;
                        if (s.cluster_id) valid++;
                    });

                    document.getElementById('stat-k').textContent = Object.keys(clusterCounts).filter(k => k !== 'N/A').length;
                    document.getElementById('stat-valid').textContent = valid + '/' + data.total;

                    // 从progress获取平均轮廓系数
                    fetch('/api/progress').then(r => r.json()).then(pd => {
                        let tasks = Object.values(pd.tasks || {}).filter(t => t.task_type === 'cluster' && t.status === 'completed');
                        if (sourceId !== '__all__') {
                            tasks = tasks.filter(t => t.source_id === sourceId);
                        }
                        if (tasks.length > 0) {
                            const scores = [];
                            tasks.forEach(t => {
                                const match = t.message.match(/轮廓系数 ([\d.]+)/);
                                if (match) scores.push(parseFloat(match[1]));
                            });
                            const avg = scores.length > 0 ? (scores.reduce((a, b) => a + b, 0) / scores.length).toFixed(3) : '-';
                            document.getElementById('stat-silhouette').textContent = avg;
                        }
                    });

                    // 画图表
                    const labels = Object.keys(clusterCounts).sort();
                    const values = labels.map(l => clusterCounts[l]);
                    const colors = labels.map((_, i) => `hsl(${(i * 360 / labels.length) % 360}, 65%, 55%)`);

                    if (clusterChart) clusterChart.destroy();
                    clusterChart = new Chart(document.getElementById('cluster-chart'), {
                        type: 'bar',
                        data: {
                            labels: labels,
                            datasets: [{ label: '样本数', data: values, backgroundColor: colors }]
                        },
                        options: {
                            responsive: true,
                            plugins: { legend: { display: false } },
                            scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }
                        }
                    });
                });
        }

        // 全选/清空
        document.getElementById('select-all').addEventListener('click', () => document.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = true));
        document.getElementById('clear-all').addEventListener('click', () => document.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = false));

        // 应用筛选
        document.getElementById('apply-filter').addEventListener('click', function() {
            const sources = Array.from(document.querySelectorAll('.source-checkbox:checked')).map(cb => cb.value);
            const batches = Array.from(document.querySelectorAll('.batch-checkbox:checked')).map(cb => cb.value);
            const statuses = Array.from(document.querySelectorAll('.status-checkbox:checked')).map(cb => cb.value);

            if (sources.length === 0 && batches.length === 0 && statuses.length === 0) {
                alert('请至少选择一个筛选条件'); return;
            }

            const params = new URLSearchParams();
            if (sources.length) params.set('sources', sources.join(','));
            if (batches.length) params.set('batches', batches.join(','));
            if (statuses.length) params.set('statuses', statuses.join(','));
            params.set('page', '1');
            params.set('page_size', '10');

            fetch(`/api/filter-data?${params}`)
                .then(r => r.json())
                .then(data => displayResults(data))
                .catch(err => alert('筛选失败'));
        });

        // 导出
        document.getElementById('export-data').addEventListener('click', function() {
            const rows = document.querySelectorAll('#results-body tr');
            if (!rows.length || rows[0].querySelector('td[colspan]')) { alert('没有数据可导出'); return; }
            let csv = 'Sample ID,Source ID,Batch ID,Type,Cluster ID,Difficulty\n';
            rows.forEach(r => csv += Array.from(r.querySelectorAll('td')).map(c => c.textContent.trim()).join(',') + '\n');
            const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(new Blob([csv], {type:'text/csv'})), download: 'filtered_data.csv' });
            a.click();
        });

        // 结果显示
        let currentPage = 1, currentFilters = {};
        function displayResults(data) {
            currentPage = data.page;
            currentFilters = data;
            document.getElementById('filter-summary').innerHTML = `找到 <strong>${data.total}</strong> 个样本，显示第 <strong>${data.page}</strong> 页，共 <strong>${data.total_pages}</strong> 页`;
            const tbody = document.getElementById('results-body');
            tbody.innerHTML = '';
            data.samples.forEach(s => {
                tbody.innerHTML += `<tr>
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${s.sample_id}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${s.source_id}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${s.batch_id}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${s.input_type}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${s.cluster_id || 'N/A'}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${s.difficulty || 'N/A'}</td>
                    <td class="px-6 py-4 whitespace-nowrap"><button onclick="alert('${s.sample_id}')" class="px-3 py-1 bg-blue-600 text-white text-xs rounded hover:bg-blue-700">查看</button></td>
                </tr>`;
            });
            addPagination(data);
        }

        function addPagination(data) {
            const old = document.getElementById('pagination-controls');
            if (old) old.remove();
            if (data.total_pages <= 1) return;
            const div = document.createElement('div');
            div.id = 'pagination-controls';
            div.className = 'flex justify-between items-center mt-4 pt-4 border-t border-gray-200';
            div.innerHTML = `
                <div class="text-sm text-gray-700">第 ${data.page} 页，共 ${data.total_pages} 页</div>
                <div class="flex space-x-2">
                    <button onclick="changePage(${data.page-1})" ${data.page<=1?'disabled':''} class="px-4 py-2 bg-gray-300 text-gray-700 rounded ${data.page<=1?'opacity-50 cursor-not-allowed':'hover:bg-gray-400'}">上一页</button>
                    <button onclick="changePage(${data.page+1})" ${data.page>=data.total_pages?'disabled':''} class="px-4 py-2 bg-gray-300 text-gray-700 rounded ${data.page>=data.total_pages?'opacity-50 cursor-not-allowed':'hover:bg-gray-400'}">下一页</button>
                </div>`;
            document.getElementById('results-table').appendChild(div);
        }

        function changePage(page) {
            const params = new URLSearchParams();
            if (currentFilters.sources) params.set('sources', currentFilters.sources);
            if (currentFilters.batches) params.set('batches', currentFilters.batches);
            if (currentFilters.statuses) params.set('statuses', currentFilters.statuses);
            params.set('page', page);
            params.set('page_size', '10');
            fetch(`/api/filter-data?${params}`).then(r => r.json()).then(data => displayResults(data));
        }
    </script>
</body>
</html>
