<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Engine - Hard Case 复核</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    <div class="min-h-screen">
        <!-- Header -->
        <header class="bg-white shadow-sm border-b">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between items-center py-4">
                    <h1 class="text-2xl font-bold text-gray-900">Hard Case 复核</h1>
                    <nav class="flex space-x-4">
                        <a href="/" class="text-gray-600 hover:text-blue-600">数据地图</a>
                        <a href="/data-filter" class="text-gray-600 hover:text-blue-600">数据筛选</a>
                        <a href="/hard-case-review" class="text-blue-600 font-medium">Hard Case复核</a>
                        <a href="/qa-sampling" class="text-gray-600 hover:text-blue-600">QA抽检</a>
                    </nav>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <!-- Controls -->
            <div class="bg-white rounded-lg shadow p-6 mb-6">
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">选择数据源</label>
                        <select id="source-select" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="">全部数据源</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">选择批次</label>
                        <select id="batch-select" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="">全部批次</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">任务类型</label>
                        <select id="task-type-select" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="">全部类型</option>
                            <option value="layout">布局检测</option>
                            <option value="text">文本识别</option>
                            <option value="formula">公式识别</option>
                            <option value="table">表格识别</option>
                        </select>
                    </div>
                    <div class="flex items-end">
                        <button onclick="loadHardCases()" class="w-full bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 transition-colors">
                            加载样本
                        </button>
                    </div>
                </div>
            </div>

            <!-- Sample Review Area -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <!-- Original Image -->
                <div class="bg-white rounded-lg shadow">
                    <div class="px-6 py-4 border-b border-gray-200">
                        <h2 class="text-lg font-semibold text-gray-900">原始图像</h2>
                    </div>
                    <div class="p-6">
                        <div id="original-image-container" class="bg-gray-100 rounded-lg min-h-[400px] flex items-center justify-center">
                            <p class="text-gray-500">请选择样本进行复核</p>
                        </div>
                        <div id="sample-info" class="mt-4 text-sm text-gray-600 hidden">
                            <div class="grid grid-cols-2 gap-4">
                                <div><strong>样本ID:</strong> <span id="sample-id"></span></div>
                                <div><strong>批次:</strong> <span id="sample-batch"></span></div>
                                <div><strong>类型:</strong> <span id="sample-type"></span></div>
                                <div><strong>难度:</strong> <span id="sample-difficulty"></span></div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Review Panel -->
                <div class="bg-white rounded-lg shadow">
                    <div class="px-6 py-4 border-b border-gray-200">
                        <h2 class="text-lg font-semibold text-gray-900">复核面板</h2>
                    </div>
                    <div class="p-6">
                        <div id="review-content" class="space-y-4">
                            <div class="text-center text-gray-500 py-8">
                                请选择样本进行复核
                            </div>
                        </div>
                        
                        <!-- Review Actions -->
                        <div id="review-actions" class="mt-6 space-y-3 hidden">
                            <div class="flex space-x-3">
                                <button onclick="submitReview('correct')" class="flex-1 bg-green-600 text-white px-4 py-2 rounded-md hover:bg-green-700 transition-colors">
                                    ✓ 正确
                                </button>
                                <button onclick="submitReview('incorrect')" class="flex-1 bg-red-600 text-white px-4 py-2 rounded-md hover:bg-red-700 transition-colors">
                                    ✗ 错误
                                </button>
                                <button onclick="submitReview('needs_expert')" class="flex-1 bg-yellow-600 text-white px-4 py-2 rounded-md hover:bg-yellow-700 transition-colors">
                                    ? 需要专家
                                </button>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">备注</label>
                                <textarea id="review-comment" rows="3" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="请输入复核备注..."></textarea>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Sample List -->
            <div class="bg-white rounded-lg shadow mt-6">
                <div class="px-6 py-4 border-b border-gray-200 flex justify-between items-center">
                    <h2 class="text-lg font-semibold text-gray-900">待复核样本列表</h2>
                    <div class="text-sm text-gray-600">
                        总计: <span id="total-samples">0</span> | 已复核: <span id="reviewed-samples">0</span>
                    </div>
                </div>
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">样本ID</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">批次</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">类型</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">难度</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">状态</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">操作</th>
                            </tr>
                        </thead>
                        <tbody class="bg-white divide-y divide-gray-200" id="samples-table">
                            <tr>
                                <td colspan="6" class="px-6 py-8 text-center text-gray-500">
                                    暂无数据，请选择条件并加载样本
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
        let currentSamples = [];
        let currentSampleIndex = 0;

        // 页面加载时初始化
        document.addEventListener('DOMContentLoaded', function() {
            loadSources();
        });

        async function loadSources() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();
                const sourceSelect = document.getElementById('source-select');
                
                data.sources.forEach(source => {
                    const option = document.createElement('option');
                    option.value = source.source_id;
                    option.textContent = `${source.source_id} (${source.category})`;
                    sourceSelect.appendChild(option);
                });
            } catch (error) {
                console.error('加载数据源失败:', error);
            }
        }

        document.getElementById('source-select').addEventListener('change', async function() {
            const sourceId = this.value;
            const batchSelect = document.getElementById('batch-select');
            batchSelect.innerHTML = '<option value="">全部批次</option>';
            
            if (sourceId) {
                try {
                    const response = await fetch(`/api/sources/${sourceId}/batches`);
                    const data = await response.json();
                    
                    data.batches.forEach(batch => {
                        const option = document.createElement('option');
                        option.value = batch.batch_id;
                        option.textContent = batch.batch_id;
                        batchSelect.appendChild(option);
                    });
                } catch (error) {
                    console.error('加载批次失败:', error);
                }
            }
        });

        async function loadHardCases() {
            const sourceId = document.getElementById('source-select').value;
            const batchId = document.getElementById('batch-select').value;
            const taskType = document.getElementById('task-type-select').value;
            
            try {
                // 这里应该调用实际的API获取hard cases
                // 暂时使用模拟数据
                currentSamples = await getMockHardCases(sourceId, batchId, taskType);
                renderSamplesTable();
                updateSampleCount();
            } catch (error) {
                console.error('加载困难样本失败:', error);
            }
        }

        function renderSamplesTable() {
            const tbody = document.getElementById('samples-table');
            
            if (currentSamples.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="px-6 py-8 text-center text-gray-500">暂无数据</td></tr>';
                return;
            }
            
            tbody.innerHTML = currentSamples.map((sample, index) => `
                <tr class="${index === currentSampleIndex ? 'bg-blue-50' : ''}">
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${sample.id}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${sample.batch_id}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${sample.task_type}</td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-red-100 text-red-800">${sample.difficulty}</span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full ${getStatusClass(sample.status)}">${sample.status}</span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm">
                        <button onclick="selectSample(${index})" class="text-blue-600 hover:text-blue-900">复核</button>
                    </td>
                </tr>
            `).join('');
        }

        function selectSample(index) {
            currentSampleIndex = index;
            const sample = currentSamples[index];
            
            // 更新表格高亮
            renderSamplesTable();
            
            // 显示样本信息
            document.getElementById('sample-info').classList.remove('hidden');
            document.getElementById('sample-id').textContent = sample.id;
            document.getElementById('sample-batch').textContent = sample.batch_id;
            document.getElementById('sample-type').textContent = sample.task_type;
            document.getElementById('sample-difficulty').textContent = sample.difficulty;
            
            // 显示图像（这里应该是实际的图像URL）
            document.getElementById('original-image-container').innerHTML = `
                <img src="/api/samples/${sample.id}/image" alt="Sample ${sample.id}" class="max-w-full max-h-[400px] object-contain" onerror="this.onerror=null; this.src='data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAwIiBoZWlnaHQ9IjIwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWxsPSIjZTVlN2ViIi8+PHRleHQgeD0iNTAlIiB5PSI1MCUiIGZvbnQtZmFtaWx5PSJBcmlhbCwgc2Fucy1zZXJpZiIgZm9udC1zaXplPSIxNCIgZmlsbD0iIzlhOWU5ZSIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZHk9Ii4zZW0iPuWbvueJh+WKoOi9veWksei0pTwvdGV4dD48L3N2Zz4=';">
            `;
            
            // 显示复核面板
            document.getElementById('review-actions').classList.remove('hidden');
            document.getElementById('review-content').innerHTML = `
                <div class="space-y-3">
                    <div class="p-3 bg-gray-50 rounded">
                        <strong>模型预测结果:</strong>
                        <p class="mt-1 text-sm">${sample.prediction || '暂无预测结果'}</p>
                    </div>
                    <div class="p-3 bg-yellow-50 rounded">
                        <strong>不一致原因:</strong>
                        <p class="mt-1 text-sm">${sample.inconsistency_reason || '模型间预测结果不一致'}</p>
                    </div>
                </div>
            `;
        }

        async function submitReview(result) {
            const sample = currentSamples[currentSampleIndex];
            const comment = document.getElementById('review-comment').value;
            
            try {
                // 这里应该调用实际的API提交复核结果
                console.log('提交复核结果:', { sampleId: sample.id, result, comment });
                
                // 更新样本状态
                sample.status = result === 'correct' ? 'approved' : result === 'incorrect' ? 'rejected' : 'expert_review';
                sample.review_comment = comment;
                
                // 渲染更新后的表格
                renderSamplesTable();
                updateSampleCount();
                
                // 清空复核面板
                document.getElementById('review-actions').classList.add('hidden');
                document.getElementById('review-content').innerHTML = '<div class="text-center text-gray-500 py-8">请选择样本进行复核</div>';
                document.getElementById('sample-info').classList.add('hidden');
                document.getElementById('original-image-container').innerHTML = '<p class="text-gray-500">请选择样本进行复核</p>';
                document.getElementById('review-comment').value = '';
                
                // 自动选择下一个未复核的样本
                const nextIndex = currentSamples.findIndex((s, i) => i > currentSampleIndex && !s.status);
                if (nextIndex !== -1) {
                    selectSample(nextIndex);
                }
                
            } catch (error) {
                console.error('提交复核结果失败:', error);
            }
        }

        function getStatusClass(status) {
            switch (status) {
                case 'approved': return 'bg-green-100 text-green-800';
                case 'rejected': return 'bg-red-100 text-red-800';
                case 'expert_review': return 'bg-yellow-100 text-yellow-800';
                default: return 'bg-gray-100 text-gray-800';
            }
        }

        function updateSampleCount() {
            const total = currentSamples.length;
            const reviewed = currentSamples.filter(s => s.status).length;
            document.getElementById('total-samples').textContent = total;
            document.getElementById('reviewed-samples').textContent = reviewed;
        }

        // 模拟数据
        async function getMockHardCases(sourceId, batchId, taskType) {
            return [
                {
                    id: 'sample_001',
                    batch_id: batchId || 'batch_001',
                    task_type: taskType || 'formula',
                    difficulty: 'hard',
                    status: null,
                    prediction: 'E=mc²',
                    inconsistency_reason: '模型A和模型B对公式识别结果不一致'
                },
                {
                    id: 'sample_002',
                    batch_id: batchId || 'batch_001',
                    task_type: taskType || 'table',
                    difficulty: 'hard',
                    status: null,
                    prediction: '3x3表格',
                    inconsistency_reason: '表格结构识别存在分歧'
                }
            ];
        }
    </script>
</body>
</html>
