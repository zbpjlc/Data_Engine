lance:
  keep_versions: 10              # 每个Lance文件保留的历史版本数
  max_file_size: 2GB            # 单个Lance文件最大大小,支持格式：2GB、500MB、1024KB、纯数字（字节）
  memory_limit: 4GB             # Lance merge_insert 操作的内存限制

ingest:
  batch_update_interval: 10000   # 每N条记录保存一次
  image_extensions:              # 支持的图片格式
    - .jpg
    - .jpeg
    - .png
    - .webp
    - .bmp
    - .tif
    - .tiff
  pdftoppm:
    dpi: 150                   # PDF渲染分辨率
    scale_to: 2000             # 最大边长
  ffmpeg:
    scale_to: 2000             # 图片缩放最大边长

embedding:
  model_name: google/siglip2-base-patch16-224
  embedding_dim: 768
  server_url: "http://127.0.0.1:8099"  # 外部 embedding server 地址
  batch_size: 32                  # 每次 HTTP 请求发送的图片数
  save_interval: 10000             # 每生成 N 条 embedding 写回一次 lance
  batch_update_interval: 10000    # 每N条记录保存一次（降低以减少内存占用）

index:
  num_partitions: 64            # IVF_PQ 聚类分区数
  num_sub_vectors: 16            # PQ 子向量数（768维推荐 16 或 32）

clustering:
  default_n_clusters: 5
  random_state: 42
  max_clusters: 10
  batch_size: 4096               # MiniBatchKMeans 每批大小
  find_k_sample_limit: 50000     # find_optimal_clusters 采样上限（超过则采样）
  fit_sample_limit: 50000        # KMeans fit 采样上限（超过则采样fit+全量predict）
  vit_batch_size: 32             # ViT 批量推理批大小

layout:
  flush_size: 10000              # 每 N 个 block 写入 text/formula/table.lance
  query_batch: 200               # 每次从 ingest.lance 加载 N 张图片

ocr:
  page_concurrency: 8
  save_interval: 10

  layout:
    provider: pp_structure
    model_name: PP-DocLayoutV3
    model_dir: null
    gpu_id: 0
    score_threshold: 0.5

  engines:
    paddleocr:
      api_url: "http://localhost:8085"
      api_key: ""
      timeout: 60
      max_retries: 3
      model: "PaddleOCR-VL-1.5-0.9B"

    glm_ocr:
      api_url: "http://localhost:8089"
      api_key: ""
      timeout: 60
      max_retries: 3

    self_ocr:
      api_url: "http://10.112.64.56:8801"        # 文本 OCR: /gen_ocr_cord
      formula_url: "http://10.112.64.56:20107"   # 公式: /formula_infer
      table_url: "http://10.112.64.56:8801"      # 表格: /tsr
      api_key: ""
      timeout: 60
      max_retries: 3

  cmcv:
    agreement_threshold: 1.0
    text_threshold: null   # 1-编辑距离
    table_threshold: null
    formula_threshold: null
    page_high_threshold: 0.8   # avg_sim >= 此值 → all_agree
    page_low_threshold: 0.4    # avg_sim >= 此值 → partial_agree，否则 all_disagree
    flush_interval: 10000  # 每处理 N 个 block 写入一次 lance 文件
    teds_batch_size: 1000  # TEDS 批量比较每批最大 pair 数

  sampling:
    base_count: 10         # 每分区探针抽样数（用于判定分区难度）
    easy_ratio: 50        # easy 分区抽 50%
    medium_ratio: 35      # medium 分区抽 35%
    hard_ratio: 15        # hard 分区抽 15%

  save_interval: 50 # 每处理 50 个 sample 保存一次

  judge_refine:
    api_url: "http://localhost:8002"  # Qwen3-VL-235B 本地服务
    max_rounds: 3                     # 最大纠错轮数
    agreement_threshold: 0.9          # Judge 置信度阈值
    timeout: 120                      # 单次 API 调用超时
    max_retries: 2                    # API 调用重试次数
