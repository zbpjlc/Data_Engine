lance:
  keep_versions: 10              # 每个Lance文件保留的历史版本数
  max_file_size: 2GB            # 单个Lance文件最大大小,支持格式：2GB、500MB、1024KB、纯数字（字节）
  memory_limit: 4GB             # Lance merge_insert 操作的内存限制

ingest:
  batch_update_interval: 10000   # 每N条记录保存一次
  image_extensions:              # 支持的图片格式
    - .jpg
    - .jpeg
    - .png
    - .webp
    - .bmp
    - .tif
    - .tiff
  pdftoppm:
    dpi: 150                   # PDF渲染分辨率
    scale_to: 2000             # 最大边长
  ffmpeg:
    scale_to: 2000             # 图片缩放最大边长

embedding:
  model_name: google/siglip2-base-patch16-224
  local_path: ~/.cache/modelscope/hub/models/google/siglip2-base-patch16-224
  embedding_dim: 768
  gpu_id: 0  # 使用的GPU编号
  batch_update_interval: 10000    # 每N条记录保存一次（降低以减少内存占用）
  progress_update_interval: 100  # 每N条记录更新一次进度到progress_state.json
  gc_interval: 1000              # 每N条记录做一次 gc.collect()

index:
  num_partitions: 256            # IVF_PQ 聚类分区数
  num_sub_vectors: 16            # PQ 子向量数（768维推荐 16 或 32）

clustering:
  default_n_clusters: 5
  random_state: 42
  max_clusters: 10

ocr:
  layout:
    provider: pp_structure
    model_name: PP-DocLayoutV3
    model_dir: null
    gpu_id: 0
    score_threshold: 0.5

  engines:
    paddleocr:
      api_url: "http://localhost:8085"
      api_key: ""
      timeout: 60
      max_retries: 3
      model: "PaddleOCR-VL-1.5-0.9B"

    glm_ocr:
      api_url: "http://localhost:8089"
      api_key: ""
      timeout: 60
      max_retries: 3
      model: null

    self_ocr:
      api_url: "http://10.112.64.56:8801"
      formula_url: "http://10.112.64.56:20107"
      table_url: "http://10.112.64.56:8801"
      api_key: ""
      timeout: 60
      max_retries: 3

  cmcv:
    agreement_threshold: 0.9
    text_threshold: null
    table_threshold: null
    formula_threshold: null

  save_interval: 50 # 每处理 50 个 sample 保存一次 element.lance
